# .devops/deploy/github-pages.yml
#
# GitHub Actions workflow for automated free API report collection
# and GitHub Pages deployment.
#
# Triggers:
#   - Daily at 11:00 Asia/Tokyo (02:00 UTC)
#   - Manual trigger via workflow_dispatch
#   - On push to main (for testing)

name: Free API News — Daily Report

on:
  schedule:
    # Daily at 11:00 Asia/Tokyo = 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only (skip collection)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.devops/**'
      - 'build/**'
      - 'index.html'

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Setup Node.js ───────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Setup timezone ──────────────────────────────────────────
      - name: Set timezone to Asia/Tokyo
        run: sudo timedatectl set-timezone Asia/Tokyo

      # ── Install dependencies ────────────────────────────────────
      - name: Install dependencies
        run: |
          npm install js-yaml 2>/dev/null || true
          npm install ajv 2>/dev/null || true

      # ── Source environment ──────────────────────────────────────
      - name: Load environment
        run: source .devops/config/env.sh

      # ── Run the skill (collection) ──────────────────────────────
      - name: Run LLM Deals Intelligence Skill
        id: collect
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          PI_MODEL: claude-sonnet-4
          PI_TIMEOUT: 600
        run: |
          echo "Running skill collection..."
          .devops/batch/run-skill.sh || {
            echo "::warning::Skill run failed, using existing report"
            if [[ ! -f report.json ]]; then
              echo "::error::No report.json available"
              exit 1
            fi
          }

      # ── Validate report ─────────────────────────────────────────
      - name: Validate report
        run: |
          if [[ -f report.json ]]; then
            node build/validate-report.js report.json .agents/skills/llm-deals-intelligence-skill/schemas/daily_report.schema.json
          else
            echo "::warning::No report.json to validate"
          fi

      # ── Build HTML ──────────────────────────────────────────────
      - name: Build HTML page
        run: .devops/deploy/build-html.sh

      # ── Setup Pages ─────────────────────────────────────────────
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          publish_source:
            branch: gh-pages
            folder: .

      # ── Upload artifact ─────────────────────────────────────────
      - name: Upload Pages artifact
        id: upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # ── Deploy to Pages ─────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

    # ── Concurrency ────────────────────────────────────────────────
    concurrency:
      group: free-api-pages
      # Don't cancel the deploy job
      cancel-in-progress: false
